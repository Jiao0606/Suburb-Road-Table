<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Excel → Suburb JSON</title>

<!-- XLSX 讀 Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body {
    font-family: sans-serif;
    padding: 20px;
    background: #f5f6fa;
}

/* 拖曳區 */
.drop-zone {
    border: 2px dashed #aaa;
    padding: 40px;
    text-align: center;
    border-radius: 12px;
    background: #fff;
    cursor: pointer;
    margin-bottom: 15px;
}

/* 按鈕 */
button {
    padding: 10px 15px;
    cursor: pointer;
    margin-right: 10px;
}

/* ===== tab 容器 ===== */
.env-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

/* ===== tab 按鈕 ===== */
.env-tab {
    padding: 10px 16px;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 14px;
}

/* hover */
.env-tab:hover {
    border-color: #4a90e2;
}

/* active 狀態 */
.env-tab.active {
    background: #4a90e2;
    color: white;
    border-color: #4a90e2;
}

/* 輸出區 */
pre {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    max-height: 400px;
    overflow: auto;
    font-size: 14px;
}
</style>
</head>

<body>

<h2>Excel to Suburb JSON</h2>

<div class="env-tabs">
    <button class="env-tab" data-env="948">948</button>
    <button class="env-tab" data-env="PK">PK</button>
</div>

<div class="drop-zone" id="dropZone">
    拖曳 Excel 檔案到這裡<br>或點擊選擇
    <input type="file" id="fileInput" hidden>
</div>

<button onclick="downloadJSON()">下載 JSON</button>

<pre id="output">尚未載入資料</pre>

<script>
let ENV = localStorage.getItem('ENV');
let jsonResult = {};

// ===== 載入資料 =====
function loadData() {
    fetch(`./data/${ENV}_Suburb.json`)
        .then(res => res.json())
        .then(data => {
            jsonResult = data;
            document.getElementById('output').textContent =
                JSON.stringify(jsonResult, null, 2);
        })
        .catch(() => {
            jsonResult = {};
        });
}

loadData();


// ===== tab 切換 =====
document.querySelectorAll('.env-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        ENV = btn.dataset.env;

        // UI active 切換
        document.querySelectorAll('.env-tab')
            .forEach(b => b.classList.remove('active'));

        btn.classList.add('active');

        // 重新載入
        loadData();
    });
});

// =========================
// 點擊選檔
// =========================
document.getElementById('dropZone').addEventListener('click', () => {
    document.getElementById('fileInput').click();
});

// =========================
// 拖曳事件
// =========================
const dropZone = document.getElementById('dropZone');

dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.style.background = '#eef';
});

dropZone.addEventListener('dragleave', () => {
    dropZone.style.background = '#fff';
});

dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.style.background = '#fff';
    const file = e.dataTransfer.files[0];
    handleFile(file);
});

// =========================
// 選檔
// =========================
document.getElementById('fileInput').addEventListener('change', e => {
    handleFile(e.target.files[0]);
});

// =========================
// Excel 處理
// =========================
function handleFile(file) {
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });

        let oldResult = jsonResult || {};
        let newResult = { ...oldResult };

        const normalize = (str) => str.trim().toLowerCase();

        workbook.SheetNames.forEach(sheetName => {

            const sheet = workbook.Sheets[sheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

            let suburbData = [];

            rows.forEach(row => {
                for (let i = 0; i < row.length; i += 2) {
                    const number = row[i];
                    const road = row[i + 1];

                    if (number && road) {
                        suburbData.push({
                            number: String(number).trim(),
                            road: String(road).trim()
                        });
                    }
                }
            });

            suburbData.sort((a, b) =>
                String(a.number).localeCompare(String(b.number), undefined, {
                    numeric: true
                })
            );

            const oldKeys = Object.keys(oldResult);

            const matchedKey = oldKeys.find(
                k => normalize(k) === normalize(sheetName)
            );

            const oldData = matchedKey ? oldResult[matchedKey] : null;

            let isChanged = false;

            if (!oldData) {
                isChanged = true;
            } else if (oldData.length !== suburbData.length) {
                isChanged = true;
            } else {
                for (let i = 0; i < suburbData.length; i++) {
                    const old = oldData[i];
                    const now = suburbData[i];

                    if (
                        !old ||
                        old.number !== now.number ||
                        old.road !== now.road
                    ) {
                        isChanged = true;
                        break;
                    }
                }
            }

            if (isChanged) {
                if (matchedKey) {
                    delete newResult[matchedKey];
                }

                newResult[sheetName] = suburbData;
            }
        });

        Object.keys(newResult).forEach(key => {
            if (Array.isArray(newResult[key]) &&
                newResult[key].length === 0) {
                delete newResult[key];
            }
        });

        jsonResult = newResult;

        document.getElementById('output').textContent =
            JSON.stringify(jsonResult, null, 2);
    };

    reader.readAsArrayBuffer(file);
}

// =========================
// 下載 JSON（已環境化）
// =========================
function downloadJSON() {
    if (!Object.keys(jsonResult).length) return;

    const now = new Date();
    const dateStr =
        now.getFullYear() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') + '_' +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0');

    const json = JSON.stringify(jsonResult, null, 2);

    const baseName = `${ENV}_Suburb.json`;
    const backupName = `${ENV}_Suburb_${dateStr}.json`;

    // 主檔
    const blob1 = new Blob([json], { type: 'application/json' });
    const url1 = URL.createObjectURL(blob1);

    const a1 = document.createElement('a');
    a1.href = url1;
    a1.download = baseName;
    a1.click();

    URL.revokeObjectURL(url1);

    // 備份
    setTimeout(() => {
        const blob2 = new Blob([json], { type: 'application/json' });
        const url2 = URL.createObjectURL(blob2);

        const a2 = document.createElement('a');
        a2.href = url2;
        a2.download = backupName;
        a2.click();

        URL.revokeObjectURL(url2);
    }, 300);
}
</script>

</body>
</html>
