<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Road 查詢系統</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background: #f2f2f2;
}

.container {
    max-width: 600px;
    margin: auto;
}

h2 {
    text-align: center;
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 12px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    box-sizing: border-box;
}

.result {
    background: #fff;
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: 0.2s;
}

.result:hover {
    transform: scale(1.02);
}

.number {
    font-weight: bold;
    color: #0066ff;
    font-size: 18px;
}

.road {
    color: #333;
    margin-top: 4px;
}

.no-result {
    text-align: center;
    color: #999;
    margin-top: 20px;
}

@media (min-width: 768px) {
    body {
        padding: 40px;
    }
}
</style>
</head>

<body>

<div class="container">
    <h2>Road 查詢</h2>
    <input type="text" id="search" placeholder="輸入 Road 關鍵字...">
    <div id="results"></div>
</div>

<script>
let data = [];

fetch('./Area.json')
    .then(res => res.json())
    .then(json => {
        data = json.Success;
    })
    .catch(err => {
        console.error("JSON 讀取失敗:", err);
    });

const searchInput = document.getElementById('search');
const resultsDiv = document.getElementById('results');

searchInput.addEventListener('input', function() {
    const keyword = this.value.trim().toLowerCase();
    resultsDiv.innerHTML = '';

    if (!keyword) return;

    const filtered = data.filter(item =>
        item.road.toLowerCase().includes(keyword)
    );

    if (filtered.length === 0) {
        resultsDiv.innerHTML = `<div class="no-result">沒有找到資料</div>`;
        return;
    }

    filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'result';
        div.innerHTML = `
            <div class="number">${item.number}</div>
            <div class="road">${item.road}</div>
        `;
        resultsDiv.appendChild(div);
    });
});
</script>

</body>
</html>
